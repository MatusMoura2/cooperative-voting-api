version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cpf-verification-db
    environment:
      POSTGRES_DB: cpf_verification
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
